<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxelCraft</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1419;
      color: white;
    }
    #root {
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      font-size: 14px;
    }
    .menu {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }
    .card {
      width: min(90vw, 400px);
      padding: 24px;
      border-radius: 20px;
      background: rgba(15, 20, 25, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      display: grid;
      gap: 12px;
    }
    input, button {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(51, 65, 85, 0.8);
      color: white;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      pointer-events: auto;
    }
    button {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      border: none;
      color: #052d16;
    }
    button:active {
      opacity: 0.9;
    }
    .hidden {
      display: none !important;
    }
    .topbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: auto;
      font-size: 13px;
    }
    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
    }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: grid;
      gap: 10px;
      pointer-events: auto;
    }
    .joy {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.2);
      position: relative;
    }
    .jstick {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(125,211,252,0.8);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .buttons {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
    }
    .btn {
      width: 80px;
      height: 50px;
      border-radius: 12px;
      background: rgba(14,116,144,0.9);
      border: none;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
